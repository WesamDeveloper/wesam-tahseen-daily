name: dene
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  motion_tab_bar: ^2.0.4
  shared_preferences: ^2.5.3
  iconsax: ^0.0.8
  url_launcher: ^6.3.2
  get: ^4.7.3
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_svg: ^2.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/dene.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/quran/quran_full.json
    - images/
    - assets/images/
    - assets/audio/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo.ttf
    - family: Rakkas
      fonts:
        - asset: fonts/Rakkas-Regular.ttf
    - family: Amiri
      fonts:
        - asset: fonts/AmiriQuran-Regular.ttf
